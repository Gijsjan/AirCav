[package]
name = "aircav-lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "aircav"
crate-type = ["cdylib"]

[dependencies]
taskchampion = { version = "2.0", default-features = false, features = ["server-sync", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = "0.21"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
